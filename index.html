<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yayasan Yunaniah Human Care</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1oAMkCsDCbhHwpZormI7J-vCYAPxt_r8K=s0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="myIframe"
      src="https://script.google.com/macros/s/AKfycbxZP_e0nrV_2RxO4t9pVR0om1vzV_a0SejyuZZAJ8pR8wvnDykcQihl4GTRkBA71ka1pA/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <script>
    // Script untuk meneruskan parameter URL dari Vercel ke dalam Iframe GAS
    const urlParams = new URLSearchParams(window.location.search);
    const page = urlParams.get('page');
    
    if (page) {
      const iframe = document.getElementById('myIframe');
      iframe.src = "https://script.google.com/macros/s/AKfycbxZP_e0nrV_2RxO4t9pVR0om1vzV_a0SejyuZZAJ8pR8wvnDykcQihl4GTRkBA71ka1pA/exec?page=" + page;
    }
  </script>
</body>
</html>
