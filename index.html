<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yayasan Yunaniah Human Care</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1oAMkCsDCbhHwpZormI7J-vCYAPxt_r8K=s0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div class="iframe-container">

    <iframe
      id="myIframe"
      src="/gas"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>

  </div>

  <script>
    // Meneruskan parameter URL dari Vercel ke backend GAS
    const urlParams = new URLSearchParams(window.location.search);
    const page = urlParams.get('page');

    if (page) {
      const iframe = document.getElementById('myIframe');

      iframe.src = '/gas?page=' + encodeURIComponent(page);
    }
  </script>

</body>
</html>
